<!DOCTYPE html>
<html>
<head>
<title>Expenses</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { margin:0; font-family:Arial; }
#wrapper { display:flex; min-height:100vh; }
#sidebar { width:220px; background:#8e44ad; color:white; padding:20px; }
#sidebar a { display:block; color:white; padding:10px; text-decoration:none; }
#sidebar a:hover { background:#732d91; }
#content { flex:1; padding:20px; background:#f3e8ff; }
</style>
</head>
<body>

<div id="wrapper">

<div id="sidebar">
<h4>Finalyze</h4>
<a href="/dashboard">Dashboard</a>
<a href="/expenses">Expenses</a>
<a href="/add">Add Expense</a>
<a href="/logout">Logout</a>
</div>

<div id="content">
<h2>All Expenses</h2>

<table class="table table-striped">
<tr>
<th>Date</th>
<th>Category</th>
<th>Amount</th>
<th>Action</th>
</tr>

{% for e in expenses %}
<tr>
<td>{{ e.date }}</td>
<td>{{ e.category }}</td>
<td>{{ e.amount }}</td>
<td>
<a href="/edit/{{ e.id }}" class="btn btn-warning btn-sm">Edit</a>
<a href="/delete/{{ e.id }}" class="btn btn-danger btn-sm">Delete</a>
</td>
</tr>
{% else %}
<tr><td colspan="4">No expenses yet</td></tr>
{% endfor %}
</table>

</div>
</div>
</body>
</html>
