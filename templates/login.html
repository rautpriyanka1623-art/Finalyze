<!DOCTYPE html>
<html>
<head>
    <title>Finalyst - Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }

        .login-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .brand-name {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: none;
            background: #0095f6;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0077cc;
        }

        .links {
            margin-top: 15px;
            font-size: 14px;
        }

        .links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .error-message {
            color: #ffdddd;
            background: rgba(255, 0, 0, 0.3);
            padding: 8px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 14px;
            opacity: 1;
            transition: opacity 0.5s ease-out;
        }
    </style>
</head>
<body>

<div class="login-box">

    <div class="brand-name">Finalyst</div>

    <form method="POST">
        <input type="text" name="username" placeholder="Username or Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Log In</button>
    </form>

    <!-- Error Message -->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div id="error-message" class="error-message">
                {{ messages[0] }}
            </div>
        {% endif %}
    {% endwith %}

    <div class="links">
        <p><a href="/forgot">Forgot Password?</a></p>
        <p>Don't have an account? <a href="/signup">Sign Up</a></p>
    </div>

</div>

<script>
    // Auto-hide error message after 3 seconds
    window.addEventListener('DOMContentLoaded', () => {
        const error = document.getElementById('error-message');
        if (error) {
            setTimeout(() => {
                error.style.opacity = '0';
            }, 3000); // 3000ms = 3 seconds
        }
    });
</script>

</body>
</html>
