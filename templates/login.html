<!DOCTYPE html>
<html>
<head>
    <title>Finalyst - Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }

        .login-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        /* Website Name Styling */
        .brand-name {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: none;
            background: #0095f6;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0077cc;
        }

        .links {
            margin-top: 15px;
            font-size: 14px;
        }

        .links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="login-box">

    <!-- Website Name -->
    <div class="brand-name">Finalyst</div>

    <form method="POST">
        <input type="text" name="username" placeholder="Username or Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Log In</button>
    </form>

    <div class="links">
        <p><a href="/forgot">Forgot Password?</a></p>
        <p>Don't have an account? <a href="/signup">Sign Up</a></p>
    </div>

</div>

</body>
</html>
