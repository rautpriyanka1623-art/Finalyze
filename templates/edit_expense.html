<!DOCTYPE html>
<html>
<head>
<title>Edit Expense</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f3e8ff; padding:20px;">
<h2>Edit Expense</h2>
<form method="POST">
<input type="date" name="date" value="{{ expense.date }}" class="form-control mb-2" required>
<input type="text" name="category" value="{{ expense.category }}" class="form-control mb-2" required>
<input type="number" step="0.01" name="amount" value="{{ expense.amount }}" class="form-control mb-2" required>
<button class="btn btn-success">Update</button>
</form>
</body>
</html>
