<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Expense – Finalyze</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
    background: linear-gradient(135deg, #d6c1ff, #b89fff);
    min-height: 100vh;
    font-family: Arial, sans-serif;
}
.container {
    margin-top: 50px;
    max-width: 600px;
}
.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
}
h2 {
    text-align: center;
    margin-bottom: 20px;
}
.btn-save {
    width: 100%;
}
@media (max-width: 768px) {
    .container {
        margin-top: 20px;
        padding: 10px;
    }
}
</style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2>Edit Expense</h2>
        <form method="POST" action="/edit/{{ expense.id }}">
            <div class="mb-3">
                <label for="date" class="form-label">Date</label>
                <input type="date" id="date" name="date" value="{{ expense.date }}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <input type="text" id="category" name="category" value="{{ expense.category }}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <input type="text" id="description" name="description" value="{{ expense.description }}" class="form-control">
            </div>
            <div class="mb-3">
                <label for="amount" class="form-label">Amount</label>
                <input type="number" step="0.01" id="amount" name="amount" value="{{ expense.amount }}" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary btn-save">Save Changes</button>
            <a href="/" class="btn btn-secondary btn-save mt-2">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
