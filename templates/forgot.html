<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password – Finalyze</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
    background: linear-gradient(135deg, #d6c1ff, #b89fff);
    font-family: Arial, sans-serif;
}
.container {
    max-width: 400px;
    margin-top: 80px;
}
.card {
    padding: 20px;
    border-radius: 10px;
    background: white;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
}
h2 { text-align: center; margin-bottom: 20px; }
.btn-reset { width: 100%; }
</style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2>Reset Password</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, msg in messages %}
            <div class="alert alert-{{category}}">{{ msg }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="mb-3">
                <input type="text" name="username" class="form-control" placeholder="Username" required>
            </div>
            <div class="mb-3">
                <input type="password" name="password" class="form-control" placeholder="New Password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-reset">Reset Password</button>
        </form>
        <p class="mt-3 text-center"><a href="/login">Back to Login</a></p>
    </div>
</div>
</body>
</html>
