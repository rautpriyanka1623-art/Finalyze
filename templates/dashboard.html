<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { margin:0; font-family:Arial; }
#wrapper { display:flex; min-height:100vh; }
#sidebar { width:220px; background:#8e44ad; color:white; padding:20px; }
#sidebar a { display:block; color:white; padding:10px; text-decoration:none; }
#sidebar a:hover { background:#732d91; }
#content { flex:1; padding:20px; background:#f3e8ff; }
</style>
</head>
<body>

<div id="wrapper">

<div id="sidebar">
<h4>Finalyze</h4>

<a href="/dashboard">Dashboard</a>
<a href="/expenses">Expenses</a>
<a href="/add">Add Expense</a>
<a href="/logout">Logout</a>
</div>

<div id="content">
<h2>Dashboard</h2>
<canvas id="chart"></canvas>

<script>
new Chart(document.getElementById("chart"), {
type: "line",
data: {
labels: [{% for e in expenses %}"{{ e.date }}",{% endfor %}],
datasets: [{
label: "Expenses",
data: [{% for e in expenses %}{{ e.amount }},{% endfor %}],
borderColor: "#8e44ad",
backgroundColor: "#d2b4f5",
fill: true
}]
}
});
</script>

</div>
</div>
</body>
</html>
